name: Branches · Status Transition

on:
  create:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: automation-branch-status-transition-${{ github.event.ref_type }}-${{ github.event.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  reconcile-issue-status:
    name: Reconcile issue status
    if: ${{ github.event.ref_type == 'branch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
          package_json_file: .github/automation/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .github/automation/.nvmrc
          cache: pnpm
          cache-dependency-path: .github/automation/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .github/automation
        run: pnpm install --frozen-lockfile

      - name: Transition issue to in progress
        working-directory: .github/automation
        run: pnpm tsx src/entrypoints/branch-status-transition.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
