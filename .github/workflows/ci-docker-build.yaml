name: Docker Build

on:
  pull_request:
    paths-ignore:
      - .github/automation/**
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-build:
    name: Build & launch containers
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create root .env file
        run: |
          cat <<EOF > srcs/.env
          PROJECT_PATH=${{ github.workspace }}
          EOF

      - name: Create backend .env file
        run: |
          cat <<EOF > srcs/containers/back/project_volume/.env
          DATABASE_URL=${{ secrets.CI_DUMMY_DATABASE_URL }}
          EOF

      - name: Create frontend .env file
        run: |
          cat <<EOF > srcs/containers/front/front_data/.env
          VITE_API_URL=/api
          EOF

      - name: Create secrets files
        run: |
          mkdir -p srcs/secrets
          echo "ci_user"             > srcs/secrets/db_user.txt
          echo "ci_password"         > srcs/secrets/db_password.txt
          echo "ci_db"               > srcs/secrets/db_name.txt
          echo "ci_jwt_secret"       > srcs/secrets/jwt_secret.txt
          echo "ci_internal_api_key" > srcs/secrets/internal_api_key.txt
          echo "admin:admin@ci.local:ci_admin_password" > srcs/secrets/admins.txt
          echo "ci_google_id"        > srcs/secrets/google_client_id.txt
          echo "ci_google_secret"    > srcs/secrets/google_client_secret.txt
          echo "ci_discord_id"       > srcs/secrets/discord_client_id.txt
          echo "ci_discord_secret"   > srcs/secrets/discord_client_secret.txt

      - name: Build prod stack and verify it serves through nginx
        run: make check-build

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f srcs/docker-compose.yml -f srcs/docker-compose.prod.yml logs --no-color
