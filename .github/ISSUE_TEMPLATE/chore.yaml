name: Chore
description: CI, Docker, tooling, GitHub configuration or other infrastructure work.
title: "[CHORE] <short title>"
labels: ["type:chore"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What part of the infrastructure is this about?
      placeholder: e.g. Add GitHub Actions workflow for lint and tests
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What is the expected outcome?
      placeholder: e.g. Every PR runs lint, tests and build, and fails on any error
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] CI runs on every pull request to main
        - [ ] CI fails on error
        - [ ] Documentation is updated if needed
