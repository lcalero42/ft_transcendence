name: Tech debt
description: Refactors or cleanup that do not add new features.
title: "[TECH-DEBT] <short title>"
labels: ["tech-debt"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What part of the codebase needs refactoring or cleanup?
      placeholder: e.g. Simplify GameService responsibilities
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong with the current code?
      placeholder: e.g. GameService handles both role assignment logic and WebSocket events
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should the code look like after this refactor?
      placeholder: e.g. GameService handles only game state, WebSocket events moved to a Gateway
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Code compiles with no warnings
        - [ ] CI (lint + tests + build) is green
        - [ ] No behavior change for existing features
