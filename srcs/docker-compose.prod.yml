services:
  nginx:
    image: transcendence-nginx:prod
    build:
      target: prod
    healthcheck:
      test: ["CMD-SHELL", "curl -fsk -o /dev/null https://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  back:
    image: transcendence-back:prod
    build:
      target: prod
    volumes:
      - back_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  postgres:
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

volumes:
  postgres_prod_data:
  back_uploads:
