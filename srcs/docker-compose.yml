services:
  nginx:
    build:
      context: ./containers
      dockerfile: nginx/Dockerfile
    container_name: nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-8443}
    volumes:
      - nginx_certs:/etc/nginx/certs
    depends_on:
      - back

  back:
    build:
      context: ./containers/back
    container_name: back
    restart: unless-stopped
    environment:
      CORS_ORIGIN: ${CORS_ORIGIN:-https://localhost:${HTTPS_PORT:-8443}}
    secrets:
      - db_user
      - db_password
      - db_name
      - jwt_secret
      - internal_api_key
      - admin_email
      - admin_password
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    container_name: postgres
    image: postgres:16
    restart: unless-stopped
    secrets:
      - db_user
      - db_password
      - db_name
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB_FILE: /run/secrets/db_name
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/db_user) -d $$(cat /run/secrets/db_name)"]
      interval: 3s
      timeout: 2s
      retries: 15

volumes:
  nginx_certs:

secrets:
  db_user:
    file: ./secrets/db_user.txt
  db_password:
    file: ./secrets/db_password.txt
  db_name:
    file: ./secrets/db_name.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  internal_api_key:
    file: ./secrets/internal_api_key.txt
  admin_email:
    file: ./secrets/admin_email.txt
  admin_password:
    file: ./secrets/admin_password.txt
