services:
  front:
    build: ./containers/front
    container_name: front
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - front_data:/app

  back:
    build: ./containers/back
    container_name: back
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - back_project:/app
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    container_name: postgres
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ma_base
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d ma_base"]
      interval: 3s
      timeout: 2s
      retries: 15

volumes:
  front_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PROJECT_PATH}/srcs/containers/front/front_data

  back_project:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PROJECT_PATH}/srcs/containers/back/project_volume