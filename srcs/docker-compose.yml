services:
  back:
    build: ./containers/back
    container_name: back
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - back_project:/app
    ports:
      - "3000:3000"

  postgres:
    container_name: postgres
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ma_base
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d ma_base"]
      interval: 3s
      timeout: 2s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  back_project:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PROJECT_PATH}/srcs/containers/back/project_volume

  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PROJECT_PATH}/srcs/containers/db/postgres_data