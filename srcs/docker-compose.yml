services:
  front:
    build: ./containers/front
    container_name: front
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - front_data:/app

  back:
    build: ./containers/back
    container_name: back
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "51212:51212"
    volumes:
      - back_project:/app
    secrets:
      - db_user
      - db_password
      - db_name
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    container_name: postgres
    image: postgres:16
    secrets:
      - db_user
      - db_password
      - db_name
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB_FILE: /run/secrets/db_name
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/db_user) -d $$(cat /run/secrets/db_name)"]
      interval: 3s
      timeout: 2s
      retries: 15

volumes:
  front_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PROJECT_PATH}/srcs/containers/front/front_data

  back_project:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PROJECT_PATH}/srcs/containers/back/project_volume

secrets:
  db_user:
    file: ./secrets/db_user.txt
  db_password:
    file: ./secrets/db_password.txt
  db_name:
    file: ./secrets/db_name.txt
