services:
  nginx:
    build: ./containers/nginx
    container_name: nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-8443}
    volumes:
      - nginx_certs:/etc/nginx/certs
    depends_on:
      - front
      - back

  front:
    build: ./containers/front
    container_name: front
    restart: unless-stopped
    environment:
      HMR_CLIENT_PORT: ${HTTPS_PORT:-8443}
    volumes:
      - front_data:/app
      - back_src_readonly:/back/project_volume/src:ro

  back:
    build: ./containers/back
    container_name: back
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:51212:51212"
    environment:
      CORS_ORIGIN: ${CORS_ORIGIN:-https://localhost:${HTTPS_PORT:-8443}}
    volumes:
      - back_project:/app
    secrets:
      - db_user
      - db_password
      - db_name
      - jwt_secret
      - internal_api_key
      - admin_email
      - admin_password
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    container_name: postgres
    image: postgres:16
    secrets:
      - db_user
      - db_password
      - db_name
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB_FILE: /run/secrets/db_name
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/db_user) -d $$(cat /run/secrets/db_name)"]
      interval: 3s
      timeout: 2s
      retries: 15

volumes:
  nginx_certs:

  front_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PROJECT_PATH}/srcs/containers/front/front_data

  back_project:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PROJECT_PATH}/srcs/containers/back/project_volume

  back_src_readonly:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PROJECT_PATH}/srcs/containers/back/project_volume/src

secrets:
  db_user:
    file: ./secrets/db_user.txt
  db_password:
    file: ./secrets/db_password.txt
  db_name:
    file: ./secrets/db_name.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  internal_api_key:
    file: ./secrets/internal_api_key.txt
  admin_email:
    file: ./secrets/admin_email.txt
  admin_password:
    file: ./secrets/admin_password.txt
