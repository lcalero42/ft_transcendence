# Opt-in overlay for a VPS with a real domain (use with `make vps`).
# Needs DOMAIN, HTTP_PORT=80, HTTPS_PORT=443 and CORS_ORIGIN in srcs/.env, and a
# certificate issued by certbot on the host (see docs/runbook.md).
services:
  nginx:
    environment:
      SSL_CERT_PATH: /etc/letsencrypt/live/${DOMAIN:?set DOMAIN in srcs/.env}/fullchain.pem
      SSL_KEY_PATH: /etc/letsencrypt/live/${DOMAIN:?set DOMAIN in srcs/.env}/privkey.pem
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
